<div class="m-3">
    <h1 class="text-3xl font-bold mb-3">Login</h1>
    <form>
        <fieldset class="fieldset">
            <legend class="fieldset-legend">E-mail</legend>
            <input type="email" class="input" placeholder="seuemail@exemplo.com" />
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset-legend">Senha</legend>
            <input type="password" class="input" placeholder="Digite sua senha" />
        </fieldset>

        <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
</div>
